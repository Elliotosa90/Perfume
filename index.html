<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECRET BY BEA — Perfume Collection</title>
<style>
  :root{
    --bg:#0e0b10; --panel:#1a1420; --accent:#c9a24b; --accent2:#e8d3a1;
    --text:#f3ecdf; --muted:#a89c8c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Georgia,serif;line-height:1.6}
  header{display:flex;flex-direction:column;align-items:center;padding:40px 20px 25px;text-align:center;background:linear-gradient(180deg,#1a1420,#0e0b10)}
  header img{width:110px;height:110px;object-fit:contain;border-radius:50%;background:#241c2e;padding:8px;margin-bottom:12px}
  header h1{font-size:2.6rem;letter-spacing:8px;color:var(--accent)}
  header p{color:var(--muted);letter-spacing:3px;text-transform:uppercase;font-size:.85rem;margin-top:6px}
  .filters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:15px}
  .filters button{background:transparent;border:1px solid var(--accent);color:var(--accent2);padding:8px 18px;border-radius:20px;cursor:pointer;letter-spacing:1px;font-size:.85rem}
  .filters button.active,.filters button:hover{background:var(--accent);color:#1a1420}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;padding:25px;max-width:1200px;margin:auto}
  .card{background:var(--panel);border:1px solid #2c2238;border-radius:12px;overflow:hidden;transition:.3s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-5px);border-color:var(--accent)}
  .card .img{height:230px;background:#241c2e;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .card img{max-width:100%;max-height:100%;object-fit:cover}
  .card .body{padding:16px;flex:1;display:flex;flex-direction:column}
  .card h3{font-size:1.05rem;letter-spacing:1px}
  .card .brand{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin:2px 0 8px}
  .card .notes{font-size:.82rem;color:var(--muted);flex:1}
  .card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .price{color:var(--accent);font-weight:bold;font-size:1.1rem}
  .soldout{color:#e05a5a;font-weight:bold;letter-spacing:2px;font-size:.8rem}
  footer{padding:40px 20px;text-align:center;background:#1a1420;border-top:1px solid #2c2238;margin-top:40px}
  footer h2{color:var(--accent);letter-spacing:4px;margin-bottom:15px}
  footer p{color:var(--muted);margin:4px 0}
  footer a{color:var(--accent2);text-decoration:none}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
</style>
</head>
<body>
<header>
  <img id="logo" alt="SECRET BY BEA logo">
  <h1>SECRET BY BEA</h1>
  <p>Perfume Samples — Wear Your Secret</p>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>No perfumes available right now — check back soon.</div>

<footer>
  <h2>CONTACT US</h2>
  <p id="cAddr"></p>
  <p id="cPhone"></p>
  <p id="cEmail"></p>
</footer>

<script>
const STORE_KEY='sbb_store';

const PLACEHOLDER='data:image/svg+xml,'+encodeURIComponent(

const DEFAULT={
  logo:'https://images.unsplash.com/photo-1615634260167-c8cdede054de?w=200&h=200&fit=crop',
  contact:{address:'12 Aroma Street, Ikeja, Lagos, Nigeria', phone:'07038539544', email:'hello@secretbybea.com'},
  products:[
    {id:1, name:'Midnight Rose',    brand:'SECRET BY BEA', notes:'Rose, Oud, Vanilla',          price:45.00, category:'Floral',   img:'https://images.unsplash.com/photo-1541643600914-78b084683601?w=400&h=500&fit=crop', inStock:true},
    {id:2, name:'Golden Dust',      brand:'SECRET BY BEA', notes:'Amber, Saffron, Musk',        price:52.00, category:'Oriental', img:'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=400&h=500&fit=crop', inStock:true},
    {id:3, name:'Ocean Whisper',    brand:'SECRET BY BEA', notes:'Sea Salt, Bergamot, Woods',   price:38.00, category:'Fresh',    img:'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400&h=500&fit=crop', inStock:true},
    {id:4, name:'Velvet Noir',      brand:'SECRET BY BEA', notes:'Black Orchid, Patchouli',     price:60.00, category:'Oriental', img:'https://images.unsplash.com/photo-1587017536225-208d2a9abd8d?w=400&h=500&fit=crop', inStock:true},
    {id:5, name:'Citrus Bloom',     brand:'SECRET BY BEA', notes:'Neroli, Lemon, Petrichor',    price:35.00, category:'Fresh',    img:'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=400&h=500&fit=crop', inStock:true},
    {id:6, name:'Ivory Musk',       brand:'SECRET BY BEA', notes:'White Musk, Iris, Cedar',     price:48.00, category:'Woody',    img:'https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=400&h=500&fit=crop', inStock:true},
    {id:7, name:'Sakura Dream',     brand:'SECRET BY BEA', notes:'Cherry Blossom, Pear',        price:42.00, category:'Floral',   img:'https://images.unsplash.com/photo-1563170351-be82bc888aa4?w=400&h=500&fit=crop', inStock:true},
    {id:8, name:'Leather & Smoke',  brand:'SECRET BY BEA', notes:'Leather, Vetiver, Tobacco',   price:55.00, category:'Woody',    img:'https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?w=400&h=500&fit=crop', inStock:true},
    {id:9, name:'Sugar Haze',       brand:'SECRET BY BEA', notes:'Caramel, Praline, Jasmine',   price:40.00, category:'Gourmand', img:'https://images.unsplash.com/photo-1595425964272-fc70d86ad397?w=400&h=500&fit=crop', inStock:true},
    {id:10,name:'Emerald Fig',      brand:'SECRET BY BEA', notes:'Fig Leaf, Green Tea, Bamboo', price:44.00, category:'Fresh',    img:'https://images.unsplash.com/photo-1590736969955-71cc94901144?w=400&h=500&fit=crop', inStock:true},
    {id:11,name:'Amber Nights',     brand:'SECRET BY BEA', notes:'Amber, Tonka, Myrrh',         price:58.00, category:'Oriental', img:'https://images.unsplash.com/photo-1615160460366-2c1f1b5d3e9b?w=400&h=500&fit=crop', inStock:true},
    {id:12,name:'White Peony',      brand:'SECRET BY BEA', notes:'Peony, Freesia, Musk',        price:46.00, category:'Floral',   img:'https://images.unsplash.com/photo-1615604343693-e6ca2fed75c1?w=400&h=500&fit=crop', inStock:true},
    {id:13,name:'Cedar & Ash',      brand:'SECRET BY BEA', notes:'Cedarwood, Incense, Clove',   price:50.00, category:'Woody',    img:'https://images.unsplash.com/photo-1615634158329-555bddd1d842?w=400&h=500&fit=crop', inStock:true},
    {id:14,name:'Vanilla Skies',    brand:'SECRET BY BEA', notes:'Vanilla, Coconut, Tonka',     price:39.00, category:'Gourmand', img:'https://images.unsplash.com/photo-1594736797933-d0401bac2f67?w=400&h=500&fit=crop', inStock:true},
    {id:15,name:'Azure Rain',       brand:'SECRET BY BEA', notes:'Aquatic Notes, Mint, Lime',   price:36.00, category:'Fresh',    img:'https://images.unsplash.com/photo-1523779917675-b6ed3a42a561?w=400&h=500&fit=crop', inStock:true},
    {id:16,name:'Jasmine Veil',     brand:'SECRET BY BEA', notes:'Jasmine Sambac, Honey',       price:49.00, category:'Floral',   img:'https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=400&h=500&fit=crop', inStock:true},
    {id:17,name:'Oud Royale',       brand:'SECRET BY BEA', notes:'Oud, Rose, Saffron',          price:75.00, category:'Oriental', img:'https://images.unsplash.com/photo-1592914610354-fd355374f4b4?w=400&h=500&fit=crop', inStock:true},
    {id:18,name:'Peach Nectar',     brand:'SECRET BY BEA', notes:'Peach, Osmanthus, Musk',      price:41.00, category:'Gourmand', img:'https://images.unsplash.com/photo-1583467854608-4c37d1c1b0a8?w=400&h=500&fit=crop', inStock:true},
    {id:19,name:'Sand & Sage',      brand:'SECRET BY BEA', notes:'Sage, Sandalwood, Salt',      price:47.00, category:'Woody',    img:'https://images.unsplash.com/photo-1590736704728-f4730355256f?w=400&h=500&fit=crop', inStock:true},
    {id:20,name:'Lumiere Bleue',    brand:'SECRET BY BEA', notes:'Blue Iris, Amber, Musk',      price:64.00, category:'Floral',   img:'https://images.unsplash.com/photo-1615604343437-c8cc3c33c26e?w=400&h=500&fit=crop', inStock:true},
    {id:21,name:'Cocoa Absolu',     brand:'SECRET BY BEA', notes:'Cocoa, Espresso, Vanilla',    price:53.00, category:'Gourmand', img:'https://images.unsplash.com/photo-1601924994987-69e26d50dc26?w=400&h=500&fit=crop', inStock:true},
    {id:22,name:'Wild Lavender',    brand:'SECRET BY BEA', notes:'Lavender, Clary Sage',        price:37.00, category:'Fresh',    img:'https://images.unsplash.com/photo-1608528577891-eb055944f2e7?w=400&h=500&fit=crop', inStock:true},
    {id:23,name:'Ruby Pomegranate', brand:'SECRET BY BEA', notes:'Pomegranate, Raspberry',      price:43.00, category:'Floral',   img:'https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?w=400&h=500&fit=crop', inStock:true},
    {id:24,name:'Smoked Vetiver',   brand:'SECRET BY BEA', notes:'Vetiver, Smoke, Grapefruit',  price:57.00, category:'Woody',    img:'https://images.unsplash.com/photo-1615634158329-555bddd1d842?w=400&h=500&fit=crop', inStock:false},
    {id:25,name:'Champagne Toast',  brand:'SECRET BY BEA', notes:'Champagne, Pear, Bergamot',   price:66.00, category:'Fresh',    img:'https://images.unsplash.com/photo-1587734195503-904fca47e0e9?w=400&h=500&fit=crop', inStock:true}
  ]
};

function deepCopy(o){return JSON.parse(JSON.stringify(o));}

function load(){
  const raw=localStorage.getItem(STORE_KEY);
  if(!raw){
    const fresh=deepCopy(DEFAULT);
    localStorage.setItem(STORE_KEY,JSON.stringify(fresh));
    return fresh;
  }
  try{
    const parsed=JSON.parse(raw);
    if(!parsed||!Array.isArray(parsed.products)||!parsed.contact){throw new Error('bad data');}
    return parsed;
  }catch(e){
    const fresh=deepCopy(DEFAULT);
    localStorage.setItem(STORE_KEY,JSON.stringify(fresh));
    return fresh;
  }
}
let data=load();

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function render(){
  const lg=document.getElementById('logo');
  lg.onerror=function(){lg.onerror=null;lg.src=LOGO_FALLBACK;};
  lg.src=data.logo||LOGO_FALLBACK;

  document.getElementById('cAddr').textContent='\uD83D\uDCCD '+data.contact.address;
  var phoneLink=document.createElement('a');
  phoneLink.href='tel:'+String(data.contact.phone).replace(/[^+\d]/g,'');
  phoneLink.textContent=data.contact.phone;
  var pPhone=document.getElementById('cPhone');
  pPhone.textContent='\uD83D\uDCDE ';
  pPhone.appendChild(phoneLink);
  var mailLink=document.createElement('a');
  mailLink.href='mailto:'+data.contact.email;
  mailLink.textContent=data.contact.email;
  var pMail=document.getElementById('cEmail');
  pMail.textContent='\u2709\uFE0F ';
  pMail.appendChild(mailLink);

  var cats=[];
  data.products.forEach(function(p){
    if(p.category&&cats.indexOf(p.category)===-1)cats.push(p.category);
  });
  cats.sort();

  var fWrap=document.getElementById('filters');
  var html='<button class="active" data-cat="">All</button>';
  cats.forEach(function(c){
    html+='<button data-cat="'+esc(c)+'">'+esc(c)+'</button>';
  });
  fWrap.innerHTML=html;
  fWrap.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      fWrap.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      showProducts(b.getAttribute('data-cat'));
    };
  });
  showProducts('');
}

function showProducts(cat){
  var list=cat?data.products.filter(function(p){return p.category===cat;}):data.products;
  var g=document.getElementById('grid');
  document.getElementById('empty').hidden=list.length>0;
  var html='';
  list.forEach(function(p){
    html+=
      '<div class="card">'+
        '<div class="img"><img src="'+esc(p.img||PLACEHOLDER)+'" data-alt="'+esc(p.img||PLACEHOLDER)+'" alt="'+esc(p.name)+'"></div>'+
        '<div class="body">'+
          '<h3>'+esc(p.name)+'</h3>'+
          '<div class="brand">'+esc(p.brand||'')+' &middot; '+esc(p.category||'')+'</div>'+
          '<div class="notes">'+esc(p.notes||'')+'</div>'+
          '<div class="foot">'+
            (p.inStock
              ?'<span class="price">$'+Number(p.price).toFixed(2)+'</span>'
              :'<span class="soldout">SOLD OUT</span>')+
          '</div>'+
        '</div>'+
      '</div>';
  });
  g.innerHTML=html;
  g.querySelectorAll('img').forEach(function(im){
    im.onerror=function(){im.onerror=null;im.src=PLACEHOLDER;};
  });
}

window.addEventListener('storage',function(e){
  if(e.key===STORE_KEY){data=load();render();}
});
render();
</script>
</body>
</html>
