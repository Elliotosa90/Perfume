function deepCopy(o){return JSON.parse(JSON.stringify(o));}

function load(){
  const raw=localStorage.getItem(STORE_KEY);
  if(!raw){
    const fresh=deepCopy(DEFAULT);
    localStorage.setItem(STORE_KEY,JSON.stringify(fresh));
    return fresh;
  }
  try{
    const parsed=JSON.parse(raw);
    if(!parsed||!Array.isArray(parsed.products)||!parsed.contact){throw new Error('bad data');}
    return parsed;
  }catch(e){
    const fresh=deepCopy(DEFAULT);
    localStorage.setItem(STORE_KEY,JSON.stringify(fresh));
    return fresh;
  }
}
let data=load();

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function render(){
  const lg=document.getElementById('logo');
  lg.onerror=function(){lg.onerror=null;lg.src=LOGO_FALLBACK;};
  lg.src=data.logo||LOGO_FALLBACK;

  document.getElementById('cAddr').textContent='\uD83D\uDCCD '+data.contact.address;
  var phoneLink=document.createElement('a');
  phoneLink.href='tel:'+String(data.contact.phone).replace(/[^+\d]/g,'');
  phoneLink.textContent=data.contact.phone;
  var pPhone=document.getElementById('cPhone');
  pPhone.textContent='\uD83D\uDCDE ';
  pPhone.appendChild(phoneLink);
  var mailLink=document.createElement('a');
  mailLink.href='mailto:'+data.contact.email;
  mailLink.textContent=data.contact.email;
  var pMail=document.getElementById('cEmail');
  pMail.textContent='\u2709\uFE0F ';
  pMail.appendChild(mailLink);

  var cats=[];
  data.products.forEach(function(p){
    if(p.category&&cats.indexOf(p.category)===-1)cats.push(p.category);
  });
  cats.sort();

  var fWrap=document.getElementById('filters');
  var html='<button class="active" data-cat="">All</button>';
  cats.forEach(function(c){
    html+='<button data-cat="'+esc(c)+'">'+esc(c)+'</button>';
  });
  fWrap.innerHTML=html;
  fWrap.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      fWrap.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      showProducts(b.getAttribute('data-cat'));
    };
  });
  showProducts('');
}

function showProducts(cat){
  var list=cat?data.products.filter(function(p){return p.category===cat;}):data.products;
  var g=document.getElementById('grid');
  document.getElementById('empty').hidden=list.length>0;
  var html='';
  list.forEach(function(p){
    html+=
      '<div class="card">'+
        '<div class="img"><img src="'+esc(p.img||PLACEHOLDER)+'" alt="'+esc(p.name)+'"></div>'+
        '<div class="body">'+
          '<h3>'+esc(p.name)+'</h3>'+
          '<div class="brand">'+esc(p.brand||'')+' &middot; '+esc(p.category||'')+'</div>'+
          '<div class="notes">'+esc(p.notes||'')+'</div>'+
          '<div class="foot">'+
            (p.inStock
              ?'<span class="price">\u20A6'+Number(p.price).toFixed(2)+'</span>'
              :'<span class="soldout">SOLD OUT</span>')+
          '</div>'+
        '</div>'+
      '</div>';
  });
  g.innerHTML=html;
  g.querySelectorAll('img').forEach(function(im){
    im.onerror=function(){im.onerror=null;im.src=PLACEHOLDER;};
  });
}

window.addEventListener('storage',function(e){
  if(e.key===STORE_KEY){data=load();render();}
});
render();
</script>
